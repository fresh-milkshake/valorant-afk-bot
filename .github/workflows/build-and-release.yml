name: Build and Release

permissions:
  contents: write

on:
  push:
    branches:
      - main
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  build:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: |
        dotnet restore src/ValorantAfk.App/ValorantAfk.App.csproj -p:NuGetAudit=false
        dotnet restore src/ValorantAfk.Tests/ValorantAfk.Tests.csproj -p:NuGetAudit=false

    - name: Build
      run: dotnet build src/ValorantAfk.App/ValorantAfk.App.csproj -c Release --no-restore

    - name: Run tests
      run: dotnet run --project src/ValorantAfk.Tests/ValorantAfk.Tests.csproj -c Release --no-restore

    - name: Publish single-file app
      run: |
        if (Test-Path bin) { Remove-Item bin -Recurse -Force }
        dotnet publish src/ValorantAfk.App/ValorantAfk.App.csproj `
          -c Release `
          -r win-x64 `
          --no-restore `
          -p:PublishSingleFile=true `
          -p:SelfContained=true `
          -p:EnableCompressionInSingleFile=true `
          -o bin
        Rename-Item bin/ValorantAfkBot.exe anti-afk.exe

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: anti-afk-win-x64
        path: bin/

  release:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.date.outputs.date }}
        name: Release v${{ steps.date.outputs.date }}
        files: |
          artifacts/anti-afk-win-x64/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
